services:
  - type: web
    name: ai-native-wfm-platform
    runtime: node
    plan: free
    buildCommand: npm test
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.16.0
      - key: NODE_ENV
        value: production
      - key: OPENAI_MODEL
        value: gpt-5.5
      - key: OPENAI_BASE_URL
        value: https://coding.gaiaworks.net/openai/v1
      - key: OPENAI_TIMEOUT_MS
        value: 45000
      - key: CODEX_API_KEY
        sync: false
      - key: DATABASE_PATH
        value: /tmp/ai-native-wfm-platform/wfm.db
