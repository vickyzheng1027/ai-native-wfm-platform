services:
  - type: web
    name: ai-native-wfm-platform
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && python -m unittest discover -s tests -v
    startCommand: python -u backend/app.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENV
        value: production
      - key: OPENAI_BASE_URL
        value: https://coding.gaiaworks.net/openai/v1
      - key: WFM_LLM_MODEL
        value: gpt-5.5
      - key: WFM_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: WFM_LLM_TIMEOUT_SECONDS
        value: 45
      - key: WFM_SOLVER_TIMEOUT_SECONDS
        value: 8
      - key: WFM_AUTOMATION_ENABLED
        value: true
      - key: DATABASE_PATH
        value: /tmp/ai-native-wfm-platform/flowstaff.db
      - key: OPENAI_API_KEY
        sync: false
