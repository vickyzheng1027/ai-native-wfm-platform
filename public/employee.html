<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>员工自助 · AI 排班助手</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --primary:#00b578;--primary-2:#00c896;--cyan:#00b8d9;
  --ink-1:#1f2329;--ink-2:#4e5969;--ink-3:#86909c;
  --line:#eceef0;--bg:#f0f2f5;--white:#fff;
  --warn:#d4380d;--warn-bg:#fff2e8;--ok-bg:#e6f7f0;
}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#e6e9ee;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}

/* phone frame */
.phone{width:390px;height:820px;max-height:96vh;background:#fff;border-radius:38px;box-shadow:0 20px 60px rgba(0,0,0,.22);overflow:hidden;display:flex;flex-direction:column;position:relative;border:10px solid #1a1a1a;}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:150px;height:26px;background:#1a1a1a;border-radius:0 0 18px 18px;z-index:50;}

/* header */
.hd{background:linear-gradient(135deg,#00b578,#00b8d9);color:#fff;padding:30px 18px 14px;flex-shrink:0;}
.hd-top{display:flex;align-items:center;gap:10px;}
.hd-av{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:16px;}
.hd-info b{font-size:15px;font-weight:700;display:block;}
.hd-info span{font-size:11px;opacity:.85;}
.hd-user{margin-left:auto;text-align:right;font-size:11px;opacity:.9;line-height:1.5;}
.hd-user b{font-size:13px;display:block;}

/* chat */
.chat{flex:1;overflow-y:auto;padding:16px 14px;background:var(--bg);display:flex;flex-direction:column;gap:12px;min-height:0;}
.chat::-webkit-scrollbar{width:4px;}.chat::-webkit-scrollbar-thumb{background:#d5d8dd;border-radius:2px;}
.b-ai{align-self:flex-start;max-width:84%;display:flex;gap:8px;}
.b-ai .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#00b578,#00b8d9);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;}
.bubble{background:#fff;border-radius:2px 14px 14px 14px;padding:10px 13px;font-size:13.5px;line-height:1.6;color:var(--ink-1);box-shadow:0 1px 3px rgba(0,0,0,.05);}
.b-user{align-self:flex-end;max-width:84%;}
.b-user .bubble{background:var(--primary);color:#fff;border-radius:14px 14px 2px 14px;}
.bubble h5{font-size:13px;margin-bottom:6px;color:var(--primary);}
.b-user .bubble h5{color:#fff;}

/* schedule mini card */
.sc-card{margin-top:8px;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.sc-row{display:flex;justify-content:space-between;align-items:center;padding:8px 11px;font-size:12.5px;border-bottom:1px solid var(--line);}
.sc-row:last-child{border-bottom:none;}
.sc-row.wk{background:#fff7f0;}
.sc-day{font-weight:600;color:var(--ink-1);}
.sc-shift{color:var(--primary);font-weight:600;}
.sc-off{color:var(--ink-3);}
.sc-time{color:var(--ink-3);font-size:11px;}

.tag-ok{display:inline-block;background:var(--ok-bg);color:var(--primary);border-radius:6px;padding:2px 8px;font-size:11px;margin-top:2px;}
.tag-warn{display:inline-block;background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:2px 8px;font-size:11px;}
.note{margin-top:8px;padding:8px 10px;background:var(--ok-bg);border-radius:8px;font-size:12px;color:var(--ink-2);line-height:1.6;}
.note.warn{background:var(--warn-bg);color:var(--warn);}
.typing{display:flex;gap:3px;padding:3px 0;}
.typing i{width:6px;height:6px;background:var(--ink-3);border-radius:50%;animation:blink 1.2s infinite;}
.typing i:nth-child(2){animation-delay:.2s;}.typing i:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,60%,100%{opacity:.3;}30%{opacity:1;}}

/* composer */
.composer{flex-shrink:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px 16px;}
.qr{display:flex;gap:8px;overflow-x:auto;padding-bottom:9px;}
.qr::-webkit-scrollbar{height:0;}
.qr-chip{white-space:nowrap;font-size:12.5px;padding:7px 13px;border-radius:16px;background:var(--bg);border:1px solid var(--line);color:var(--ink-2);cursor:pointer;transition:.15s;flex-shrink:0;}
.qr-chip:active,.qr-chip:hover{border-color:var(--primary);color:var(--primary);background:var(--ok-bg);}
.in-row{display:flex;gap:8px;align-items:center;}
.in-row input{flex:1;border:1px solid var(--line);border-radius:20px;padding:10px 15px;font-size:13.5px;outline:none;transition:.2s;}
.in-row input:focus{border-color:var(--primary);}
.in-send{width:40px;height:40px;border-radius:50%;background:var(--primary);color:#fff;border:none;font-size:16px;cursor:pointer;flex-shrink:0;}
.in-send:active{background:#00a06a;}
</style>
</head>
<body>
  <div class="phone">
    <div class="notch"></div>
    <div class="hd">
      <div class="hd-top">
        <div class="hd-av">✦</div>
        <div class="hd-info"><b>AI 排班助手</b><span>查班 · 请假 · 换班 · 偏好，一句话搞定</span></div>
        <div class="hd-user"><b id="uName">小王</b><span>收银 / 导购</span></div>
      </div>
    </div>
    <div class="chat" id="chat"></div>
    <div class="composer">
      <div class="qr">
        <div class="qr-chip" onclick="quick('看看我这周的排班')">📅 我的排班</div>
        <div class="qr-chip" onclick="quick('我周三生病了想请假')">🤒 我要请假</div>
        <div class="qr-chip" onclick="quick('我想把周二的晚班换掉')">🔄 申请换班</div>
        <div class="qr-chip" onclick="quick('昨天忘记打下班卡了')">🕐 补卡</div>
        <div class="qr-chip" onclick="quick('会员日闭店盘点需要多留两小时')">➕ 加班</div>
        <div class="qr-chip" onclick="quick('以后周末尽量让我休息')">⭐ 登记偏好</div>
      </div>
      <div class="in-row">
        <input id="input" placeholder="和 AI 说说你的需求…" autocomplete="off">
        <button class="in-send" onclick="onSend()">➤</button>
      </div>
    </div>
  </div>
<script src="employee-app.js"></script>
</body>
</html>
