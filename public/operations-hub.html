<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 劳动力运营中枢 · Workforce Copilot</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --primary:#00b578;--primary-2:#00c896;--cyan:#00b8d9;--agent:#0958d9;
  --ink-1:#1f2329;--ink-2:#4e5969;--ink-3:#86909c;
  --line:#e8eaed;--bg:#f4f6f8;--white:#fff;
  --warn:#d4380d;--warn-bg:#fff2e8;--ok-bg:#e6f7f0;--gold:#fa8c16;--gold-bg:#fff7e6;
}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--ink-1);height:100vh;display:flex;flex-direction:column;overflow:hidden;}

/* top status bar */
.topbar{height:54px;background:linear-gradient(90deg,#0a1f44,#123a6b);color:#fff;display:flex;align-items:center;padding:0 20px;gap:18px;flex-shrink:0;}
.tb-logo{font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px;}
.tb-logo .d{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#00b578,#00b8d9);display:flex;align-items:center;justify-content:center;}
.tb-stat{display:flex;flex-direction:column;font-size:11px;color:rgba(255,255,255,.6);}
.tb-stat b{font-size:14px;color:#fff;font-weight:700;}
.tb-stat b.ok{color:#4ade80;}.tb-stat b.warn{color:#ffb454;}
.tb-sep{width:1px;height:26px;background:rgba(255,255,255,.15);}
.tb-right{margin-left:auto;display:flex;gap:10px;align-items:center;}
.tb-btn{font-size:12px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;padding:6px 12px;border-radius:16px;cursor:pointer;transition:.2s;}
.tb-btn:hover{background:rgba(255,255,255,.22);}
.tb-btn.reset{background:transparent;}

/* 3-column */
.layout{flex:1;display:grid;grid-template-columns:210px 1fr 340px;gap:0;overflow:hidden;min-height:0;}
.col{overflow-y:auto;min-height:0;padding:14px;}
.col::-webkit-scrollbar{width:5px;}.col::-webkit-scrollbar-thumb{background:#dfe2e6;border-radius:3px;}
.col-left{background:#fff;border-right:1px solid var(--line);}
.col-mid{background:var(--bg);}
.col-right{background:#fff;border-left:1px solid var(--line);}

.sec-lbl{font-size:11px;color:var(--ink-3);font-weight:700;letter-spacing:1px;margin:6px 0 8px;text-transform:uppercase;}

/* phases */
.phase{display:flex;gap:10px;padding:10px;border-radius:10px;margin-bottom:8px;cursor:pointer;border:1px solid var(--line);transition:.2s;position:relative;}
.phase:hover{border-color:var(--primary);}
.phase.active{background:var(--ok-bg);border-color:var(--primary);}
.phase.done .pn{background:var(--primary);color:#fff;}
.phase .pn{width:24px;height:24px;border-radius:50%;background:var(--bg);color:var(--ink-3);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;}
.phase.active .pn{background:var(--primary);color:#fff;}
.phase .pt b{font-size:13px;display:block;}
.phase .pt span{font-size:11px;color:var(--ink-3);}

/* module nav */
.mod{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;font-size:12px;color:var(--ink-2);margin-bottom:3px;transition:.2s;}
.mod .md{width:8px;height:8px;border-radius:50%;background:var(--line);flex-shrink:0;}
.mod.touched{color:var(--ink-1);font-weight:600;}
.mod.touched .md{background:var(--primary);box-shadow:0 0 0 3px var(--ok-bg);}
.mod small{margin-left:auto;color:var(--ink-3);font-weight:400;font-size:10px;}

/* mid: goal input */
.goal-box{background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(15,34,58,.07);padding:14px;margin-bottom:14px;}
.goal-box h3{font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.goal-box textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;font-size:13px;resize:none;height:70px;font-family:inherit;outline:none;}
.goal-box textarea:focus{border-color:var(--primary);}
.goal-actions{display:flex;gap:8px;margin-top:10px;}
.btn{border:none;border-radius:9px;padding:9px 16px;font-size:13px;cursor:pointer;font-weight:600;transition:.2s;}
.btn-primary{background:var(--primary);color:#fff;}.btn-primary:hover{background:#00a06a;}
.btn-ghost{background:var(--bg);color:var(--ink-2);border:1px solid var(--line);}.btn-ghost:hover{border-color:var(--primary);color:var(--primary);}
.btn:disabled{opacity:.5;cursor:not-allowed;}

/* AI state machine */
.ai-state{background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(15,34,58,.07);padding:14px;margin-bottom:14px;}
.ai-state h3{font-size:13px;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.ai-state h3 .now{margin-left:auto;font-size:11px;font-weight:600;color:var(--agent);background:var(--agent-bg,#eef4ff);padding:3px 10px;border-radius:12px;}
.canvas{display:flex;flex-direction:column;gap:8px;}
.task{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-radius:9px;background:#f7f9fb;border:1px solid var(--line);font-size:12.5px;animation:fadein .3s;}
@keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.task .ti{width:22px;height:22px;border-radius:6px;background:var(--agent-bg,#eef4ff);color:var(--agent);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;}
.task .tc{flex:1;}
.task .tc b{color:var(--ink-1);}
.task .tc .tool{font-size:11px;color:var(--ink-3);margin-top:2px;font-family:ui-monospace,Menlo,monospace;}
.task .st{font-size:11px;color:var(--primary);flex-shrink:0;}
.task.risk{background:var(--warn-bg);border-color:#ffcdb2;}
.task.risk .ti{background:#ffe0cc;color:var(--warn);}

/* plan cards */
.plans{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px;}
.plan{background:#fff;border-radius:12px;border:1px solid var(--line);padding:12px;position:relative;transition:.2s;}
.plan.rec{border:2px solid var(--primary);box-shadow:0 4px 16px rgba(0,181,120,.16);}
.plan .rec-tag{position:absolute;top:-10px;left:12px;background:var(--primary);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;}
.plan h4{font-size:13px;margin-bottom:8px;}
.plan .row{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;color:var(--ink-2);border-bottom:1px dashed var(--line);}
.plan .row b{color:var(--ink-1);}
.plan .row.bad b{color:var(--warn);}
.plan .row.good b{color:var(--primary);}
.plan .comp{margin-top:8px;font-size:11px;padding:5px 8px;border-radius:6px;}
.plan .comp.ok{background:var(--ok-bg);color:var(--primary);}
.plan .comp.no{background:var(--warn-bg);color:var(--warn);}
.plan .pick{margin-top:9px;width:100%;border:none;border-radius:8px;padding:8px;font-size:12px;cursor:pointer;font-weight:600;background:var(--bg);color:var(--ink-2);}
.plan.rec .pick{background:var(--primary);color:#fff;}
.plan .pick:disabled{opacity:.4;cursor:not-allowed;}

.result-card{background:linear-gradient(135deg,#e6f7f0,#e9f6ff);border-radius:12px;padding:14px;margin-bottom:14px;display:none;}
.result-card.show{display:block;}
.result-card h3{font-size:14px;margin-bottom:8px;color:var(--primary);}
.result-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.rg{background:#fff;border-radius:8px;padding:9px;text-align:center;}
.rg .v{font-size:18px;font-weight:800;color:var(--ink-1);}
.rg .l{font-size:11px;color:var(--ink-3);margin-top:2px;}

/* phase panels */
.phase-panel{background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(15,34,58,.07);padding:14px;margin-bottom:14px;display:none;}
.phase-panel.show{display:block;}
.phase-panel h3{font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.mini-tab{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.mini-card{border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:12.5px;margin-bottom:8px;line-height:1.6;color:var(--ink-2);}
.mini-card b{color:var(--ink-1);}
.acc-table{width:100%;border-collapse:collapse;font-size:12px;}
.acc-table th,.acc-table td{border:1px solid var(--line);padding:6px 8px;text-align:left;}
.acc-table th{background:var(--bg);color:var(--ink-2);}

/* right col */
.guard{background:var(--warn-bg);border:1px solid #ffcdb2;border-radius:10px;padding:11px;margin-bottom:12px;}
.guard.ok{background:var(--ok-bg);border-color:#a6e6cf;}
.guard h4{font-size:12px;margin-bottom:7px;color:var(--warn);}
.guard.ok h4{color:var(--primary);}
.guard .item{font-size:11.5px;padding:4px 0;color:var(--ink-2);display:flex;gap:6px;}
.kpi-mini{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.km{background:var(--bg);border-radius:9px;padding:9px 11px;}
.km .l{font-size:10px;color:var(--ink-3);}
.km .v{font-size:16px;font-weight:800;margin-top:2px;}
.km .v.ok{color:var(--primary);}.km .v.warn{color:var(--warn);}

.changes{margin-bottom:12px;}
.change-item{font-size:11.5px;padding:7px 9px;background:var(--bg);border-radius:7px;margin-bottom:5px;color:var(--ink-2);}
.confirm-bar{position:sticky;bottom:0;background:#fff;padding-top:8px;}
.confirm-bar .btn{width:100%;}

/* feedback center */
.fb{border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:9px;}
.fb .ft{font-size:12px;font-weight:700;margin-bottom:6px;color:var(--agent);}
.fb .fm{font-size:11.5px;color:var(--ink-2);}
.fb .delta{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px;}
.fb .delta .b{color:var(--ink-3);text-decoration:line-through;}
.fb .delta .a{color:var(--primary);font-weight:800;}
.fb .ev{font-size:10.5px;color:var(--ink-3);line-height:1.5;}
.empty{color:var(--ink-3);font-size:12px;text-align:center;padding:16px;}
</style>
</head>
<body>
  <div class="topbar">
    <div class="tb-logo"><span class="d">✦</span>Workforce Copilot</div>
    <div class="tb-sep"></div>
    <div class="tb-stat">活动<b id="tbEvent">—</b></div>
    <div class="tb-stat">业务阶段<b id="tbTime">活动前</b></div>
    <div class="tb-stat">预算<b id="tbBudget">—</b></div>
    <div class="tb-stat">人员覆盖率<b id="tbCoverage" class="warn">—</b></div>
    <div class="tb-stat">合规<b id="tbCompliance" class="ok">就绪</b></div>
    <div class="tb-right">
      <div class="tb-btn reset" onclick="resetDemo()">↻ 一键重置剧情</div>
      <div class="tb-btn" onclick="location.href='schedule.html'">门店排班台</div>
      <div class="tb-btn" onclick="location.href='employee.html'">员工端</div>
    </div>
  </div>

  <div class="layout">
    <!-- 左栏：阶段 + 模块导航 -->
    <div class="col col-left">
      <div class="sec-lbl">活动阶段</div>
      <div id="phases"></div>
      <div class="sec-lbl" style="margin-top:16px;">WFM 模块编排</div>
      <div id="modules"></div>
    </div>

    <!-- 中栏：目标输入 + AI 状态机 + 方案 -->
    <div class="col col-mid">
      <div class="goal-box">
        <h3>🎯 经营目标（自然语言）</h3>
        <textarea id="goalInput" placeholder="用一句话描述经营目标…"></textarea>
        <div class="goal-actions">
          <button class="btn btn-ghost" onclick="fillGoal()">填入会员日目标</button>
          <button class="btn btn-primary" id="genBtn" onclick="generate()">生成方案</button>
        </div>
      </div>

      <div class="ai-state" id="aiStateBox" style="display:none;">
        <h3>🤖 AI 执行计划<span class="now" id="aiNow">IDLE</span></h3>
        <div class="canvas" id="canvas"></div>
      </div>

      <div class="plans" id="plans"></div>

      <div class="result-card" id="resultCard">
        <h3>✅ 方案已执行 · 状态已回写</h3>
        <div class="result-grid" id="resultGrid"></div>
      </div>

      <!-- 活动中 -->
      <div class="phase-panel" id="panelDuring">
        <h3>🏃 活动中 · 执行与考勤</h3>
        <div id="duringBody"></div>
      </div>

      <!-- 活动后 -->
      <div class="phase-panel" id="panelAfter">
        <h3>📊 活动后 · 复盘与人效</h3>
        <div id="afterBody"></div>
      </div>
    </div>

    <!-- 右栏：合规护栏 + 指标 + 待确认 + 反哺 -->
    <div class="col col-right">
      <div class="sec-lbl">合规护栏</div>
      <div id="guardWrap"><div class="guard ok"><h4>✓ 合规就绪</h4><div class="item">等待方案生成后逐项校验</div></div></div>

      <div class="sec-lbl">关键指标</div>
      <div class="kpi-mini" id="kpiMini">
        <div class="km"><div class="l">覆盖率</div><div class="v warn" id="mCov">—</div></div>
        <div class="km"><div class="l">新增成本</div><div class="v" id="mCost">—</div></div>
        <div class="km"><div class="l">预算余量</div><div class="v ok" id="mBudget">—</div></div>
        <div class="km"><div class="l">受影响员工</div><div class="v" id="mEmp">—</div></div>
      </div>

      <div class="sec-lbl">待确认变更</div>
      <div class="changes" id="changes"><div class="empty">暂无待确认变更</div></div>

      <div class="sec-lbl" id="fbLbl" style="display:none;">数据反哺中心</div>
      <div id="fbWrap"></div>

      <div class="confirm-bar" id="confirmBar" style="display:none;">
        <button class="btn btn-primary" id="confirmBtn" onclick="confirmPlan()">确认执行推荐方案</button>
      </div>
    </div>
  </div>

<script src="hub-app.js"></script>
</body>
</html>
